name: Docs

on:
  push:
    branches: [main]
    paths: [docs/**, mise.toml, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, mise.toml, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Only mdBook is needed here, not the Rust toolchain
      - uses: jdx/mise-action@v5
        with:
          install_args: mdbook
      - run: mdbook build docs
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
