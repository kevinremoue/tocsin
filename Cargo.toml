[package]
name = "tocsin"
version = "0.1.0"
edition = "2024"
description = "Lightweight SBOM monitor that alerts when your production dependencies are hit by an actively exploited CVE (CISA KEV)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kevinremoue/tocsin"
readme = "README.md"
keywords = ["sbom", "cyclonedx", "vulnerability", "cve", "security"]
categories = ["web-programming::http-server"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "gzip"] }
maud = { version = "0.27.0", features = ["axum"] }
# ring is the provider sqlx already uses: reqwest reuses it instead of pulling in aws-lc-rs
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_urlencoded = "0.7.1"
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate", "json"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
