name: tocsin

services:
  postgres:
    image: postgres:18
    environment:
      # Local development credentials only: change them for any real deployment
      POSTGRES_USER: tocsin
      POSTGRES_PASSWORD: tocsin
      POSTGRES_DB: tocsin
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tocsin"]
      interval: 2s
      retries: 15

  tocsin:
    build: .
    environment:
      DATABASE_URL: postgres://tocsin:tocsin@postgres:5432/tocsin
      # Enables the admin API (project creation). Example: TOCSIN_ADMIN_TOKEN=$(openssl rand -hex 32)
      TOCSIN_ADMIN_TOKEN: ${TOCSIN_ADMIN_TOKEN:-}
      RUST_LOG: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
